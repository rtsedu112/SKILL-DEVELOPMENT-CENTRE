<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Application Form</title>
    <style>
        /* Modern Gradient Background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Form Container Design */
        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
        }

        .form-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .form-container p {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Form Layout Styles */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* Interactive Focus Effect */
        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
        }

        /* Submit Button with Hover Effects */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Internship Application</h2>
    <p>Please fill out the form below to apply for an internship.</p>
    
    <form action="#" method="POST">
        <!-- Full Name -->
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        </div>

        <!-- Email Address -->
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
        </div>

        <!-- Mobile Number -->
        <div class="form-group">
            <label for="phone">Mobile Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter 10-digit number" required>
        </div>

        <!-- Internship Domain Selection -->
        <div class="form-group">
            <label for="domain">Select Domain / Role</label>
            <select id="domain" name="domain" required>
                <option value="" disabled selected>Choose a domain</option>
                <option value="web-dev">Web Development</option>
                <option value="app-dev">App Development</option>
                <option value="ui-ux">UI/UX Design</option>
                <option value="digital-marketing">Digital Marketing</option>
                <option value="data-science">Data Science</option>
            </select>
        </div>

        <!-- Resume Drive Link -->
        <div class="form-group">
            <label for="resume">Resume Link (Google Drive / Dropbox)</label>
            <input type="url" id="resume" name="resume" placeholder="https://google.com..." required>
        </div>

        <!-- Statement of Purpose / Cover Letter -->
        <div class="form-group">
            <label for="message">Why do you want to join this internship?</label>
            <textarea id="message" name="message" rows="4" placeholder="Briefly describe your skills and motivation..."></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn">Submit Application</button>
    </form>
</div>

</body>
</html>
