<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>इंटरनशिप एप्लीकेशन फॉर्म</title>
    <style>
        /* पूरे पेज का बैकग्राउंड (ग्रेडिएंट) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* फॉर्म कंटेनर का डिज़ाइन */
        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
        }

        .form-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        /* इनपुट फील्ड्स की सेटिंग */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* फोकस करने पर बॉर्डर का रंग बदलना */
        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
        }

        /* सबमिट बटन का स्टाइल (ग्रेडिएंट और होवर इफेक्ट) */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>इंटरनशिप रजिस्ट्रेशन</h2>
    
    <form action="#" method="POST">
        <!-- पूरा नाम -->
        <div class="form-group">
            <label for="name">पूरा नाम (Full Name)</label>
            <input type="text" id="name" name="name" placeholder="अपना नाम दर्ज करें" required>
        </div>

        <!-- ईमेल आईडी -->
        <div class="form-group">
            <label for="email">ईमेल एड्रेस (Email Address)</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
        </div>

        <!-- फोन नंबर -->
        <div class="form-group">
            <label for="phone">मोबाइल नंबर (Mobile Number)</label>
            <input type="tel" id="phone" name="phone" placeholder="9876543210" required>
        </div>

        <!-- इंटरनशिप डोमेन -->
        <div class="form-group">
            <label for="domain">इंटरनशिप का क्षेत्र (Select Domain)</label>
            <select id="domain" name="domain" required>
                <option value="" disabled selected>एक विकल्प चुनें</option>
                <option value="web-dev">वेब डेवलपमेंट (Web Development)</option>
                <option value="app-dev">ऐप डेवलपमेंट (App Development)</option>
                <option value="ui-ux">UI/UX डिज़ाइनिंग</option>
                <option value="digital-marketing">डिजिटल मार्केटिंग</option>
            </select>
        </div>

        <!-- रेज्यूमे लिंक -->
        <div class="form-group">
            <label for="resume">रेज्यूमे का लिंक (Resume Drive Link)</label>
            <input type="url" id="resume" name="resume" placeholder="https://google.com..." required>
        </div>

        <!-- मैसेज या कवर लेटर -->
        <div class="form-group">
            <label for="message">आप यह इंटरनशिप क्यों करना चाहते हैं?</label>
            <textarea id="message" name="message" rows="4" placeholder="अपने बारे में संक्षेप में बताएं..."></textarea>
        </div>

        <!-- सबमिट बटन -->
        <button type="submit" class="submit-btn">एप्लीकेशन सबमिट करें</button>
    </form>
</div>

</body>
</html>
